<!doctype html>
<html lang="zh-CN">
<head>

<body>
<div class="scene" id="scene">
  <header class="header">
    <div class="header-inner">
      <a class="brand" href="#home" aria-label="叨叨诡秘首页">
        <img src="assets/app_icon.ico" width="34" height="34" alt="">
        <div class="brand-name">叨叨诡秘<small>DPS LOGS</small></div>
      </a>
      <nav class="nav" aria-label="主导航">
        <a href="#home">首页</a>
        <a href="#history">历史战斗</a>
        <a href="#records">数据排行</a>
        <a href="#insights">职业统计</a>
      </nav>
      <div class="upload-area">
        <button class="upload-status-btn" id="uploadStatusBtn" type="button" aria-expanded="false" aria-controls="uploadPopover">
          <span class="upload-dot" aria-hidden="true"></span><span>我该如何上传数据</span><span class="upload-arrow" aria-hidden="true">▾</span>
        </button>
        <div class="upload-popover" id="uploadPopover" hidden>
          <div class="upload-pop-head"><div><div class="upload-pop-title">数据上传</div><div class="upload-pop-sub">通过客户端同步你的战斗记录</div></div></div>
          <div class="upload-status-line"><span>已收录战斗</span><b id="uploadCount">正在读取</b></div>
          <div class="upload-status-line"><span>最近收录</span><b id="lastUpload">正在读取</b></div>
          <div class="upload-guide">
            <div class="upload-guide-title">怎么上传？</div>
            <div class="upload-step"><span class="step-no">1</span><div><b>打开叨叨诡秘客户端</b><small>登录后保持客户端正常运行</small></div></div>
            <div class="upload-step"><span class="step-no">2</span><div><b>一场 BOSS 战斗胜利</b><small>自动上传</small></div></div>
            <div class="upload-step"><span class="step-no">3</span><div><b>同步角色信息</b><small>展示角色名称、职业、技能与已采集的装备</small></div></div>
          </div>
        </div>
      </div>
    </div>
  </header>
  <main class="hero">
    <div class="kicker">叨叨诡秘dps-logs</div>
    <h1>叨叨诡秘</h1>
    <div class="subtitle">Boss 战斗数据查询</div>
    <form class="search" role="search">
      <div class="search-input-wrap"><span class="search-icon" aria-hidden="true"></span><input type="search" maxlength="48" placeholder="输入角色名或公开昵称" aria-label="角色名或公开昵称" autocomplete="off"></div>
      <button type="submit" aria-label="搜索战斗记录">→</button>
    </form>
    <div class="search-note">查询角色的 <b>Boss 战斗记录与 DPS 表现</b></div>
    <div class="home-data" aria-live="polite"><span id="historySummary">正在读取历史战斗场次</span></div>
    <a class="home-help" href="#share">加QQ群下载叨叨dps-log：1094925831 / 165966739</a>
  </main>
  <div class="fog" aria-hidden="true"></div><div class="skyline" aria-hidden="true"><div class="layer"></div></div>
  <noscript><p class="noscript-note">请启用 JavaScript 查看历史列表和战斗详情。</p></noscript>
