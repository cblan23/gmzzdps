server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name gmzz.daodaogame.vip;

    ssl_certificate /etc/letsencrypt/live/gmzz.daodaogame.vip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gmzz.daodaogame.vip/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/gmzz;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        expires -1;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    location ^~ /api/v1/dps/public/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
    }

    location ~* \.(?:css|js|json)$ {
        expires -1;
        try_files $uri =404;
    }

    location ~* \.(?:png|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}

server {
    listen 80;
    listen [::]:80;
    server_name gmzz.daodaogame.vip;

    return 301 https://gmzz.daodaogame.vip$request_uri;
}
