# Domain HTTPS endpoint for application updates, feedback, and DPS monitoring.
# Keep the existing IP-only vhost unchanged for older application releases.

server {
    listen 80;
    listen [::]:80;
    server_name daodaogame.vip www.daodaogame.vip;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://daodaogame.vip$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name daodaogame.vip www.daodaogame.vip;

    ssl_certificate /etc/letsencrypt/live/daodaogame.vip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/daodaogame.vip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    index index.html index.htm index.nginx-debian.html;

    client_max_body_size 40m;

    location = /api/v1/feedback {
        limit_req zone=daodao_feedback burst=3 nodelay;
        limit_req_status 429;
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    error_page 429 = @feedback_rate_limited;

    location @feedback_rate_limited {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 429 '{"error":"上传过于频繁，请稍后重试"}';
    }

    location = /api/v1/dps/diagnostic {
        limit_req zone=daodao_feedback burst=3 nodelay;
        limit_req_status 429;
        limit_except POST { deny all; }
        client_max_body_size 256k;
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8765/healthz;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /api/v1/dps/ {
        limit_except GET POST { deny all; }
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    location = /api/v2/dps/combat/clock {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    location = /dps-monitor {
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    location = /dps-monitor/ {
        return 301 /dps-monitor;
    }

    location / {
        root /var/www/html;
        try_files $uri $uri/ =404;
    }
}
